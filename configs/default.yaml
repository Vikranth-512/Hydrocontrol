# Algae nutrient dosing control — default experiment configuration (ecosystem regulation v4)

seed: 42
experiment_name: algae_dosing_policy_v3

naming:
  trajectory_index_padding: 3

paths:
  raw: data/raw
  synthetic: data/synthetic
  processed: data/processed
  checkpoints: checkpoints
  figures: figures
  scalers: data/processed/scalers
  metadata: data/processed/metadata

simulation:
  dt_seconds: 60.0
  trajectory_length_min: 100
  trajectory_length_max: 500
  num_trajectories: 200
  ec_target: 1.2
  ec_safe_min: 0.4
  ec_safe_max: 2.5
  flowrate_min: 0.0
  flowrate_max: 5.0
  duration_min: 0.0
  duration_max: 30.0
  min_time_between_doses: 120.0
  noise_std:
    water_temp: 0.05
    ec: 0.02
    turbidity: 1.0
    ph: 0.02
    dissolved_oxygen: 0.1

dynamics:
  sensor_gain_ec: 0.8
  biomass_optical_factor: 2.2
  algae_sensor_tau: 0.045
  immediate_absorption_fraction: 0.28
  delay_kernel: [0.15, 0.25, 0.30, 0.20, 0.10]
  max_queue_release_rate: 0.55   # raised from 0.048 — must cover peak kernel slot at max dose (0.54 mass/step)
  release_damping: 0.85
  background_dilution_rate: 0.002
  maximum_uptake_rate: 0.018
  half_saturation_mass: 1.0
  internal_capacity: 0.5
  maximum_growth_rate: 0.012
  growth_yield: 0.6
  maintenance_cost: 0.0005
  biomass_nutrient_content: 0.1
  mortality_rate: 0.0002
  mineralization_rate: 0.002
  mineralization_efficiency: 0.3  # Fraction of dead biomass that mineralizes to dissolved
  maintenance_to_detritus_fraction: 0.5
  maintenance_to_dissolved_fraction: 0.2  # Fraction of maintenance waste recycled to dissolved
  maintenance_lost_fraction: 0.6  # Fraction of maintenance permanently lost
  growth_metabolic_efficiency: 0.7  # Fraction of growth nutrients incorporated into biomass
  nutrient_retention_efficiency: 0.5  # Overall nutrient retention (0.35-0.6 recommended)
  harvest_rate: 0.0005  # Fraction of biomass harvested per timestep
  damage_rate: 0.0001
  repair_rate: 0.01
  starvation_damage_multiplier: 2.0  # Additional damage under starvation
  starvation_reserve_threshold: 0.15  # Reserve ratio below which starvation stress applies
  osmotic_half_effect: 5.0
  osmotic_safe_threshold: 0.2
  basal_repair_rate: 0.0003
  light_attenuation_half_mass: 250.0
  temp_ref: 25.0
  temp_opt: 26.0
  temp_sigma: 5.0
  q10_coefficient: 2.2
  temperature_rate_modifier: 2.0
  ambient_temp_mean: 22.0
  temp_relaxation_rate: 0.025
  ec_decay_jitter: 0.0
  gain_jitter: 0.0
  # Actuator unit convention and dose-to-nutrient conversion
  # flowrate_unit: mL/min  (informational; validated at runtime)
  # duration_unit: s       (informational; validated at runtime)
  # nutrient_conversion_neu_per_ml: NEU per mL of effective delivered solution.
  # Default 1.0 preserves legacy benchmark numerical behavior.
  # Changing this value scales all dose inputs to the simulator.
  nutrient_conversion_neu_per_ml: 1.0

disturbances:
  ec_shock_prob: 0.02
  ec_shock_magnitude: 0.08
  temp_spike_prob: 0.02
  temp_spike_magnitude: 3.0
  heatwave_prob: 0.01
  heatwave_duration: 40
  heatwave_magnitude: 4.0
  cold_shock_prob: 0.01
  cold_shock_magnitude: -3.5
  seasonal_drift_rate: 0.002
  mixing_noise_std: 0.006
  uptake_pulse_prob: 0.025
  uptake_pulse_factor: 1.35
  actuator_failure_prob: 0.01
  actuator_failure_efficiency: 0.35
  nutrient_depletion_prob: 0.02
  nutrient_depletion_magnitude: 0.12
  turbidity_sediment_prob: 0.015
  turbidity_sediment_magnitude: 18.0
  correlated_noise_rho: 0.85

# ---------------------------------------------------------------------------
# Ecosystem control shared parameters (used by PID, labeler, and tuner)
# ---------------------------------------------------------------------------
ecosystem_control:
  rho_setpoint: 0.50        # reserve ratio reference operating point (Droop half-quota) - increased from 0.30 to encourage healthier reserves
  internal_capacity: 0.5    # mirrors dynamics.internal_capacity — used for rho computation
  health_floor: 0.70        # health below this drives elevated mortality cost
  reserve_floor: 0.20       # starvation boundary; buffer ~100 steps before maintenance failure
  starvation_threshold: 0.10 # acute starvation — reserve ratio below this is critical
  b_bloom_threshold: 300.0  # biomass beyond which uptake exceeds dosing capacity
  b_ref: 120.0              # normalizer for biomass rate cost (not a setpoint)
  rho_risk_scale: 0.15      # scale for exponential starvation risk in terminal cost

labeling:
  # Ecosystem Regulation — long-horizon biological health labels
  debug_mode: false
  rollout_mode: impulse  # single dose at step 0, consistent with deployment pattern
  horizon_steps: 100             # reduced from 200 based on CHST results showing 95.2% action agreement
  tie_break_epsilon: 0.005
  max_diagnostic_samples: 8
  candidate_flowrates: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
  candidate_durations: [0.0, 5.0, 10.0, 15.0, 20.0, 25.0, 30.0]
  # Cost function weights (ecosystem health)
  weights:
    health: 1.5              # J_health — irreversibility guard
    damage: 1.0              # J_damage — leading health indicator
    reserve: 1.2             # J_reserve — primary dosing target
    biomass_rate: 0.6        # Medium penalty: acceleration/velocity
    biomass_envelope: 0.3    # Weak penalty: safe operating zone
    maintenance: 2.0         # Strong penalty: root cause of detritus
    detritus: 1.0            # Penalty for future dissolved nutrients
    dissolved_inventory: 1.0 # Sustained tank loading
    dissolved_accumulation: 3.0 # Very strong penalty: tank poisoning
    osmotic: 5.0             # Dominant penalty: uptake shutdown
    nutrient_cost: 0.25      # J_nutrient — pure dosing cost (decoupled from reserve)
    action_smoothness: 0.15  # J_action — control smoothness
  # Per-term thresholds
  health_floor: 0.70          # mirrors ecosystem_control.health_floor
  reserve_floor: 0.20         # mirrors ecosystem_control.reserve_floor
  reserve_oscillation_weight: 0.5  # weight on var(rho) inside J_reserve
  reserve_setpoint_weight: 2.0     # weight on setpoint tracking in J_reserve - encourages healthy reserve operating point
  reserve_low_weight: 2.0         # weight on (rho_target - rho)^2 for depleted reserves - asymmetric penalty
  reserve_high_weight: 0.5        # weight on (rho - rho_target)^2 for excessive reserves - asymmetric penalty
  damage_rate_weight: 2.0     # weight on Δdamage vs accumulated damage in J_damage
  nutrient_quadratic_weight: 0.5   # weight on (avg_dose)^2 in J_nutrient
  tail_fraction: 0.35         # fraction of rollout used for tail metrics
  b_ref: 120.0                # normalizer for J_biomass_rate
  b_bloom_threshold: 300.0    # used in terminal cost V(s_T)

preprocessing:
  sequence_length: 64
  prediction_horizon: 1
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  scaler_type: standard
  rolling_window: 8
  include_biological_features: true
  internal_capacity: 0.5  # MUST match dynamics.internal_capacity for consistent reserve_ratio

model:
  input_size: null
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  output_size: 2

training:
  batch_size: 64
  epochs: 80
  learning_rate: 0.001
  weight_decay: 1.0e-5
  grad_clip: 1.0
  loss_type: action_pair_weighted_huber  # Use joint action pair frequency weighting
  max_weight_multiplier: 4.0  # Maximum weight as multiple of majority class weight
  huber_beta: 1.0  # Beta parameter for Huber loss
  quantize_bins: 10  # Number of bins to quantize continuous actions for frequency computation
  # Legacy parameters for weighted_masked_huber (not used with action_pair_weighted_huber)
  auto_compute_weights: true
  flowrate_positive_weight: null
  flowrate_zero_weight: null
  duration_positive_weight: null
  duration_zero_weight: null
  control_loss_weights:
    action: 1.0
    instability: 0.2
    aggressive_change: 0.15
    excessive_dose: 0.0  # EC-based penalty, set to 0
  early_stopping_patience: 12
  lr_scheduler: reduce_on_plateau
  lr_factor: 0.5
  lr_patience: 5

evaluation:
  closed_loop_steps: 3500
  pid:
    kp: 2.683
    ki: 0.05
    kd: 0.126
  rule_based:
    rho_target: 0.50
    deadband: 0.04
    critical_low: 0.20
    low_flowrate: 2.0
    low_duration: 15.0
    critical_flowrate: 4.0
    critical_duration: 20.0
  mpc_reserve:
    target_reserve_ratio: 0.50
    minimum_reserve_ratio: 0.20
    prediction_horizon: 5
    max_candidate_sequences: 30
    action_history_length: 3
    tracking_weight: 1.0
    low_reserve_weight: 5.0
    dose_effort_weight: 0.10
    action_change_weight: 0.05
    ridge_lambda: 1.0
    history_window_length: 60
    min_time_between_doses: 120.0
    low_flowrate: 2.0
    low_duration: 15.0
    critical_flowrate: 4.0
    critical_duration: 20.0
  multiseed_long_horizon:
    enabled: true
    horizon: 3500
    scenarios:
      - normal
      - heatwave
      - nutrient_depletion
      - cold_shock
      - noisy_sensors
      - delayed_response
      - actuator_failure
      - actuator_saturation
      - sediment
      - temp_spike
      - ec_drop
    n_seeds: 30
    base_seed: 42
    bootstrap_replicates: 5000
    bootstrap_seed: 12345
    confidence_level: 0.95
    # Documented practical-effect and equivalence thresholds
    # ec_mae: 0.04 mS/cm matches the controller deadband (0.04) and 2*sigma_ec sensor noise (0.02)
    # final_biomass: 5.0 g/L corresponds to ~5-6% meaningful culture yield divergence from 80-100 g/L baseline
    # total_dose: 10.0 mL corresponds to 20 moderate dosing pulses (0.5 mL each), reflecting material chemical cost
    # final_reserve_ratio: 0.04 matches the regulation deadband (0.04) around rho_setpoint=0.50
    practical_thresholds:
      ec_mae: 0.04
      final_biomass: 5.0
      total_dose: 10.0
      final_reserve_ratio: 0.04
    figure_dir: figures/multiseed_long_horizon
    report_dir: reports/multiseed_long_horizon

pid_tuning:
  enabled: true
  coarse_search:
    kp_range: [0.1, 10.0]
    ki_range: [0.05, 0.30]
    kd_range: [0.05, 5.0]
    n_kp: 8
    n_ki: 6
    n_kd: 6
    max_evaluations: 72
  refinement:
    top_candidates: 8
    step_kp: 0.35
    step_ki: 0.015
    step_kd: 0.12
  evaluation:
    n_episodes_coarse: 3
    episode_length_coarse: 1200
    disturbance_modes_coarse: [normal, heatwave]
    n_episodes: 4
    episode_length: 2500
    disturbance_modes: [normal, heatwave, nutrient_depletion]
  validation:
    n_episodes: 1
    episode_length: 2500
    long_horizon_length: 3500
    disturbance_modes:
      - normal
      - heatwave
      - cold_shock
      - nutrient_depletion
      - actuator_failure
      - sediment
    water_temps: [17.0, 22.0, 28.0, 30.0]
    initial_ecs: [0.85, 1.0, 1.2, 1.35]
    seeds: [42, 123, 456]
  regulatory_constraints:
    # Ecosystem health gates (replace EC-based gates)
    min_health_mean_tail: 0.70       # mean health in last 35% of episode
    max_biomass_cv_tail: 0.35        # biomass coefficient of variation in tail
    min_reserve_floor_fraction: 0.60 # fraction of steps where rho > 0.20
    max_starvation_fraction: 0.20    # fraction of steps where rho < 0.10
    # Shared
    steady_state_tail_fraction: 0.35
  efficiency_weights:
    nutrient_usage: 0.4
    smoothness: 0.2
    aggressive_control: 0.3
  weights:
    # Secondary efficiency weights (used after feasibility gate)
    health_mean: 1.0
    damage_mean: 0.8
    reserve_mean: 0.6
    nutrient_usage: 0.4
    smoothness: 0.2
  pid_behavior:
    integral_min: -8.0
    integral_max: 8.0
    derivative_alpha: 0.85
    deadband: 0.04
    max_delta_flowrate: 1.5
    max_delta_duration: 8.0

export:
  format: torchscript

# ---------------------------------------------------------------------------
# PAR-03: Normalized Parameter Sensitivity Matrix Analysis
# ---------------------------------------------------------------------------
parameter_sensitivity:
  enabled: true

  # Mechanistic simulator parameters to include in the sensitivity analysis.
  # These are scalar biological/physical parameters that materially define the
  # simulator dynamics. Sensor, administrative, and derived parameters are excluded.
  parameters:
    - maximum_uptake_rate
    - half_saturation_mass
    - internal_capacity
    - maximum_growth_rate
    - growth_yield
    - maintenance_cost
    - biomass_nutrient_content
    - mortality_rate
    - mineralization_rate
    - mineralization_efficiency
    - damage_rate
    - repair_rate
    - osmotic_half_effect
    - light_attenuation_half_mass
    - q10_coefficient
    - background_dilution_rate

  # Trajectory features used to evaluate sensitivity.
  # Primary (sensor-observable) features — used for S_obs matrix.
  # biomass_* features are latent-state diagnostics evaluated separately.
  observables:
    - ec_mean
    - ec_final
    - ec_std
    - turbidity_mean
    - turbidity_final
    - turbidity_std

  latent_diagnostics:
    - biomass_mean
    - biomass_final
    - biomass_std

  # Operating scenarios — must cover contrasting dynamical regimes.
  scenarios:
    - normal
    - heatwave
    - nutrient_depletion
    - cold_shock

  # Central finite-difference perturbation fractions: ±frac * nominal.
  # Multiple values are used for perturbation convergence analysis.
  perturbation_fractions:
    - 0.005
    - 0.01
    - 0.02

  normalization:
    # Minimum output magnitude used as y_scale guard (prevents divide-by-near-zero).
    # S_ij = (p_j / max(|y_i|, min_output_scale)) * (y_hi - y_lo) / (p_hi - p_lo)
    minimum_output_scale: 0.01

  # Absolute cosine-similarity threshold for flagging collinear parameter pairs.
  # Uses |cos(theta)| >= threshold to catch both parallel and anti-parallel directions.
  collinearity_threshold: 0.95

  # Relative singular-value threshold for numerical rank determination.
  # sigma_k is treated as zero if sigma_k / sigma_max < numerical_rank_tolerance.
  numerical_rank_tolerance: 1.0e-4

  # Fixed RNG seed for all scenario trajectories (guarantees determinism).
  random_seed: 42

  # Whether to produce a supplementary full-state (latent) sensitivity matrix.
  # The observable matrix (S_obs) is always the primary result.
  include_latent_state_analysis: true

